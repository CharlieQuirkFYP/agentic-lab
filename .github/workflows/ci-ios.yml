name: CI / iOS

on:
  pull_request:
    branches: [main]
    paths:
      - "ios-app/**"
      - "pheme-va/**"
      - ".github/workflows/ci-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: "5"

jobs:
  contracts:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios-app/package-lock.json
      - name: Install locked mobile dependencies
        run: npm ci
      - name: Type check app and tests
        run: npm run typecheck
      - name: Test native client, persistence and artifact preparation
        run: npm test
      - name: Test Swift host lifecycle and WAV decoding without model weights
        run: npm run test:native
      - name: Bundle the actual iOS routes
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/expo-bundle"

  ios:
    name: iOS / ${{ matrix.variant }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Production Whisper packaging and its Swift smoke test run in native-link.
        variant: [disabled, test]
    defaults:
      run:
        working-directory: pheme-va
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: llvm-tools-preview
      - name: Cache Cargo dependency downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: ios-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pheme-va/Cargo.lock') }}
          restore-keys: |
            ios-cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Install native build tools
        run: brew install cmake
      - name: Build and package both iOS slices
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "target/ios/${{ matrix.variant }}"
          bash scripts/build-ios.sh "${{ matrix.variant }}" 2>&1 | tee "target/ios/${{ matrix.variant }}/build.log"
      - name: Test the Expo-owned Swift C bridge on the macOS host
        run: bash scripts/test-ffi-swift.sh "${{ matrix.variant }}"
      - name: Retain FFI build diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-${{ matrix.variant }}-results
          path: |
            pheme-va/target/ios/${{ matrix.variant }}/build-metadata.txt
            pheme-va/target/ios/${{ matrix.variant }}/build.log
            pheme-va/target/ios/${{ matrix.variant }}/*-symbols.txt
          if-no-files-found: warn

  native-link:
    # Expo SDK 57 requires Xcode 26.4 / Swift 6.3 or newer.
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios-app/package-lock.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: llvm-tools-preview
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: ios-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pheme-va/Cargo.lock') }}
          restore-keys: |
            ios-cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Install native build tools
        run: brew install cmake cocoapods
      - name: Install locked dependencies
        run: npm ci
      - name: Build production transcription and reasoning without model weights
        shell: bash
        run: |
          set -o pipefail
          npm run native:build 2>&1 | tee "$RUNNER_TEMP/ios-libraries-build.log"
      - name: Verify the module's prepared production inputs
        run: npm run native:check
      - name: Test the production Whisper Swift C bridge on the macOS host
        run: bash ../pheme-va/scripts/test-ffi-swift.sh whisper
      - name: Upload production transcription library and build metadata
        uses: actions/upload-artifact@v5
        with:
          name: PhemeVA-cpu-xcframework
          path: |
            pheme-va/target/ios/whisper/PhemeVA.xcframework
            pheme-va/target/ios/whisper/build-metadata.txt
          if-no-files-found: error
      - name: Upload production reasoning library and build metadata
        uses: actions/upload-artifact@v5
        with:
          name: PhemeReasoning-cpu-xcframework
          path: |
            pheme-va/target/ios/reply/PhemeReasoning.xcframework
            pheme-va/target/ios/reply/build-metadata.txt
          if-no-files-found: error
      - name: Generate native project and install pods
        run: |
          npx expo prebuild --platform ios --no-install
          npx pod-install
      - name: Compile Expo app, module and linked Rust libraries for simulator
        shell: bash
        run: |
          set -o pipefail
          task_workspace=$(node -e 'const f=require("fs"); const w=f.readdirSync("ios").find(x=>x.endsWith(".xcworkspace")); if(!w) process.exit(1); console.log("ios/"+w)')
          task_scheme=$(node -e 'const c=require("./app.json"); console.log(c.expo.name.replace(/[^a-zA-Z0-9]/g,""))')
          xcodebuild -workspace "$task_workspace" -scheme "$task_scheme" \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/expo-derived" CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build \
            2>&1 | tee "$RUNNER_TEMP/expo-native-build.log"
      - name: Retain native link diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: expo-native-build-diagnostics
          path: |
            ${{ runner.temp }}/ios-libraries-build.log
            ${{ runner.temp }}/expo-native-build.log
            pheme-va/target/ios/whisper/build-metadata.txt
            pheme-va/target/ios/whisper/*-symbols.txt
            pheme-va/target/ios/reply/build-metadata.txt
            pheme-va/target/ios/reply/*-exports.txt
            pheme-va/target/ios/reply/*-dependencies.txt
            pheme-va/target/ios/reply/*-sha256.txt
          if-no-files-found: warn

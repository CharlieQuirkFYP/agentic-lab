name: Pheme VA CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "pheme-va/**"
      - ".github/workflows/pheme-va-ci.yml"

permissions:
  contents: read

jobs:
  pheme-va:
    name: Rust Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pheme-va
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux audio and native model build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev cmake clang libclang-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Verify combined Whisper and reply binaries
        run: cargo build -p server -p reply-native --features server/whisper

      - name: Test direct model downloads offline
        run: bash scripts/test-download-model.sh

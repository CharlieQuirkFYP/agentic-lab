name: Expo iOS app CI

on:
  pull_request:
    branches: [main]
    paths:
      - "ios-app/**"
      - "pheme-va/**"
      - ".github/workflows/ios-app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expo-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios-app/package-lock.json
      - name: Install locked mobile dependencies
        run: npm ci
      - name: Type check app and tests
        run: npm run typecheck
      - name: Test native client, persistence and artifact preparation
        run: npm test
      - name: Test Swift host lifecycle and WAV decoding without model weights
        run: npm run test:native
      - name: Bundle the actual iOS routes
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/expo-bundle"

  native-link:
    # Expo SDK 57 requires Xcode 26.4 / Swift 6.3 or newer.
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios-app/package-lock.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: llvm-tools-preview
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: expo-ios-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pheme-va/Cargo.lock') }}
      - name: Install native build tools
        run: brew install cmake xcodegen
      - name: Install locked dependencies
        run: npm ci
      - name: Build production device/simulator XCFramework without model weights
        run: bash ../pheme-va/scripts/build-ios.sh whisper
      - name: Prepare and verify the module's production inputs
        run: npm run native:prepare && npm run native:check
      - name: Generate native project and install pods
        run: |
          npx expo prebuild --platform ios --no-install
          npx pod-install
      - name: Compile Expo app, module and linked Rust library for simulator
        shell: bash
        run: |
          set -o pipefail
          task_workspace=$(node -e 'const f=require("fs"); const w=f.readdirSync("ios").find(x=>x.endsWith(".xcworkspace")); if(!w) process.exit(1); console.log("ios/"+w)')
          task_scheme=$(node -e 'const c=require("./app.json"); console.log(c.expo.name.replace(/[^a-zA-Z0-9]/g,""))')
          xcodebuild -workspace "$task_workspace" -scheme "$task_scheme" \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/expo-derived" CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build \
            2>&1 | tee "$RUNNER_TEMP/expo-native-build.log"
      - name: Retain native link diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: expo-native-build-diagnostics
          path: |
            ${{ runner.temp }}/expo-native-build.log
            pheme-va/target/ios/whisper/build-metadata.txt
          if-no-files-found: warn

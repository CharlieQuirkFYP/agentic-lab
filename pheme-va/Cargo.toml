[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/runtime",
    "crates/cli",
    "crates/server",
    "crates/ffi",
    "crates/metrics",
    "crates/models/transcription/whispercpp",
    "crates/models/transcription/zipformer",
    "crates/models/reasoning",
    "crates/models/reasoning/native",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.78"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
whisper-rs = { version = "0.16", default-features = false }

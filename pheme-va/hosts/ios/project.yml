name: PhemePhone
# Paths are relative to target/ios/<variant>/project, passed as --project-root.
options:
  bundleIdPrefix: org.agenticlab
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ${PHEME_SWIFT_FLAGS}"
targets:
  PhemePhone:
    type: application
    platform: iOS
    sources: [../../../../hosts/ios/Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Pheme
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Record speech for transcription on this iPhone."
        NSLocalNetworkUsageDescription: "Connect to your paired desktop Pheme monitor."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.agenticlab.PhemePhone
    dependencies:
      - framework: ${PHEME_XCFRAMEWORK}
        embed: false
      - sdk: Accelerate.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: libc++.tbd
      - sdk: libresolv.tbd
  BridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../../../hosts/ios/Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PhemePhone
      - framework: ${PHEME_XCFRAMEWORK}
        embed: false
      - sdk: Accelerate.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: libc++.tbd
      - sdk: libresolv.tbd
schemes:
  PhemePhone:
    build:
      targets:
        PhemePhone: all
        BridgeTests: [test]
    test:
      targets: [BridgeTests]
      environmentVariables:
        PHEME_VA_TEST_MODEL: ${PHEME_VA_TEST_MODEL}
        PHEME_VA_TEST_AUDIO: ${PHEME_VA_TEST_AUDIO}

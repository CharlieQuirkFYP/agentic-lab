[package]
name = "zipformer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "LiteRT Zipformer CTC speech-recognition adapter for Pheme VA"

[features]
default = []
litert = ["dep:litert"]

[dependencies]
rustfft = "6.4"
thiserror.workspace = true
va_core = { package = "core", path = "../../core" }
litert = { version = "0.2.1", optional = true }

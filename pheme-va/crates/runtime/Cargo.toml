[package]
name = "va_runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared Pheme agent scheduling and model runtime for native and HTTP hosts"

[features]
default = []
whisper = ["dep:whispercpp"]
whisper-metal = ["whisper", "whispercpp/metal"]
whisper-coreml = ["whisper", "whispercpp/coreml"]
zipformer = ["dep:zipformer", "zipformer/litert"]

[dependencies]
anyhow = "1.0"
sha2 = "0.10"
serde.workspace = true
tokio = { version = "1.0", features = ["rt", "sync", "time", "macros"] }
va_core = { package = "core", path = "../core" }
metrics = { path = "../metrics", features = ["desktop"] }
reply-model = { path = "../models/reasoning" }
whispercpp = { path = "../models/transcription/whispercpp", optional = true }
zipformer = { path = "../models/transcription/zipformer", optional = true }

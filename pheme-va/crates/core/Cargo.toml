[package]
name = "core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Portable audio-to-text and incident-processing core for Agentic Lab"

[lib]
name = "va_core"

[features]
default = []
whisper = ["dep:whisper-rs"]
whisper-metal = ["whisper", "whisper-rs/metal"]
whisper-coreml = ["whisper", "whisper-rs/coreml"]

[dependencies]
hound = "3.5"
metrics = { path = "../metrics", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
whisper-rs = { workspace = true, optional = true }

[package]
name = "metrics"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Portable application and device metrics with host-defined exporters"

[features]
default = ["desktop"]
desktop = ["dep:sysinfo"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.30", optional = true }

[package]
name = "ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Small C ABI bridge for embedding the Pheme VA core in iOS and Android"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
whisper = ["va_core/whisper"]
whisper-metal = ["va_core/whisper-metal"]
whisper-coreml = ["va_core/whisper-coreml"]

[dependencies]
metrics = { path = "../metrics", default-features = false }
serde_json.workspace = true
va_core = { package = "core", path = "../core" }

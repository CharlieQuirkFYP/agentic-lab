[package]
name = "cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Terminal recorder and WAV transcription client for the Pheme VA"

[features]
default = []
whisper = ["va_core/whisper"]
whisper-metal = ["va_core/whisper-metal"]
whisper-coreml = ["va_core/whisper-coreml"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
cpal = "0.15"
crossterm = "0.29"

va_core = { package = "core", path = "../core" }

[package]
name = "server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HTTP development wrapper around the portable Pheme VA core"

[features]
default = []
whisper = ["va_core/whisper"]
whisper-metal = ["va_core/whisper-metal"]
whisper-coreml = ["va_core/whisper-coreml"]

[dependencies]
anyhow = "1.0"
axum = "0.8"
bytes = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "sync"] }
va_core = { package = "core", path = "../core" }

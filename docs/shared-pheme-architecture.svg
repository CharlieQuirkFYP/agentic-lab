<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shared Pheme architecture with separate phone and dashboard workflows</title>
  <desc id="desc">The phone and dashboard use separate Go API workflows that share the underlying Pheme platform. The dashboard reads persisted benchmark results and does not connect directly to Pheme.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/></marker>
    <style>
      .box { fill:#fff; stroke:#334155; stroke-width:2; rx:12; }
      .client { fill:#e0f2fe; stroke:#0369a1; }
      .api { fill:#fef3c7; stroke:#b45309; }
      .pheme { fill:#dcfce7; stroke:#15803d; }
      .store { fill:#f3e8ff; stroke:#7e22ce; }
      .boundary { fill:#f0fdf4; stroke:#15803d; stroke-width:3; stroke-dasharray:10 7; rx:18; }
      .title { font:700 28px Arial; fill:#0f172a; }
      .label { font:600 16px Arial; fill:#0f172a; text-anchor:middle; }
      .small { font:14px Arial; fill:#475569; text-anchor:middle; }
      .section { font:700 18px Arial; fill:#334155; }
      .line { stroke:#64748b; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .phoneLine { stroke:#0284c7; }
      .benchLine { stroke:#b45309; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="800" y="42" class="title" text-anchor="middle">One Shared Pheme Platform, Two Separate Workflows</text>

  <rect x="40" y="75" width="310" height="760" class="boundary" fill="#eff6ff" stroke="#0369a1"/>
  <text x="70" y="112" class="section">Clients</text>
  <rect x="80" y="170" width="230" height="78" class="box client"/><text x="195" y="202" class="label">iPhone app</text><text x="195" y="226" class="small">record, review, approve</text>
  <rect x="80" y="560" width="230" height="78" class="box client"/><text x="195" y="592" class="label">Web dashboard</text><text x="195" y="616" class="small">charts, details, exports</text>

  <rect x="420" y="75" width="300" height="760" class="boundary" fill="#fffbeb" stroke="#b45309"/>
  <text x="450" y="112" class="section">Go backend</text>
  <rect x="460" y="170" width="220" height="78" class="box api"/><text x="570" y="202" class="label">Voice API</text><text x="570" y="226" class="small">turns and SSE events</text>
  <rect x="460" y="560" width="220" height="78" class="box api"/><text x="570" y="592" class="label">Benchmark API</text><text x="570" y="616" class="small">experiments and metrics</text>
  <rect x="460" y="700" width="220" height="78" class="box api"/><text x="570" y="732" class="label">Worker</text><text x="570" y="756" class="small">asynchronous benchmark runs</text>

  <rect x="800" y="75" width="370" height="760" class="boundary" fill="#f0fdf4" stroke="#15803d"/>
  <text x="830" y="112" class="section">Shared Pheme platform</text>
  <rect x="850" y="170" width="270" height="78" class="box pheme"/><text x="985" y="202" class="label">Pheme STT</text><text x="985" y="226" class="small">Whisper transcription</text>
  <rect x="850" y="330" width="270" height="78" class="box pheme"/><text x="985" y="362" class="label">Pheme reply engine</text><text x="985" y="386" class="small">approved text response</text>
  <rect x="850" y="650" width="270" height="78" class="box pheme"/><text x="985" y="682" class="label">Pheme benchmark runtime</text><text x="985" y="706" class="small">test-case execution and metrics</text>

  <rect x="1250" y="75" width="310" height="760" class="boundary" fill="#faf5ff" stroke="#7e22ce"/>
  <text x="1280" y="112" class="section">Results and responses</text>
  <rect x="1290" y="170" width="230" height="78" class="box client"/><text x="1405" y="202" class="label">Transcript review</text><text x="1405" y="226" class="small">back to phone</text>
  <rect x="1290" y="330" width="230" height="78" class="box client"/><text x="1405" y="362" class="label">Streamed reply</text><text x="1405" y="386" class="small">back to phone</text>
  <rect x="1290" y="650" width="230" height="78" class="box store"/><text x="1405" y="682" class="label">Benchmark SQLite</text><text x="1405" y="706" class="small">experiments and metrics</text>
  <rect x="1290" y="760" width="230" height="52" class="box client"/><text x="1405" y="791" class="label">Dashboard reads API results</text>

  <path d="M310 209 H460" class="line phoneLine"/>
  <path d="M680 209 H850" class="line phoneLine"/>
  <path d="M1120 209 H1290" class="line phoneLine"/>
  <path d="M680 209 V369 H850" class="line phoneLine"/>
  <path d="M1120 369 H1290" class="line phoneLine"/>

  <path d="M310 599 H460" class="line benchLine"/>
  <path d="M680 599 V739" class="line benchLine"/>
  <path d="M680 739 H850" class="line benchLine"/>
  <path d="M1120 689 H1290" class="line benchLine"/>
  <path d="M1405 728 V760" class="line benchLine"/>
  <path d="M1290 786 H1180 V599 H680" class="line benchLine"/>

  <text x="800" y="865" class="small">Phone: Go Voice API ↔ shared Pheme ↔ phone</text>
  <text x="800" y="887" class="small">Dashboard: Go Benchmark API → worker → shared Pheme → SQLite → dashboard API → dashboard</text>
</svg>
